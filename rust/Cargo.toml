[package]
name = "chert-sdk"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false
license = "MIT"
description = "Explicit, single-attempt async Chert messaging HTTP transport"

[dependencies]
reqwest = { version = "=0.13.4", default-features = false, features = ["rustls", "json"] }
serde = "=1.0.228"
serde_json = "=1.0.145"

[dev-dependencies]
tokio = { version = "=1.48.0", features = ["macros", "rt", "time"] }
