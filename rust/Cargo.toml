[package]
name = "chert-sdk"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false
license = "MIT"
description = "Explicit async Chert iMessage and FaceTime clients, with isolated credentials and no retries"
repository = "https://github.com/cherthq/sdk"
readme = "README.md"
include = ["src/**", "examples/**", "tests/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE"]

[lib]
name = "trychert_sdk"

[features]
default = ["reqwest"]
reqwest = ["dep:reqwest"]
worker = ["dep:worker", "dep:futures-util"]

[dependencies]
futures-util = { version = "=0.3.34", default-features = false, optional = true }
hmac = "=0.12.1"
http = "=1.5.0"
reqwest = { version = "=0.13.4", default-features = false, features = ["rustls", "json"], optional = true }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
subtle = "=2.6.1"
url = "=2.5.8"
worker = { version = "=0.8.7", optional = true }

[dev-dependencies]
tokio = { version = "=1.48.0", features = ["macros", "rt", "time"] }
