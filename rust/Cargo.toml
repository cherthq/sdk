[package]
name = "chert-sdk"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false
license = "MIT"
description = "Explicit async Chert iMessage and FaceTime clients, with isolated credentials and no retries"
repository = "https://github.com/cherthq/sdk"
readme = "README.md"
include = ["src/**", "examples/**", "tests/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE"]

[lib]
name = "trychert_sdk"

[dependencies]
reqwest = { version = "=0.13.4", default-features = false, features = ["rustls", "json"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"

[dev-dependencies]
tokio = { version = "=1.48.0", features = ["macros", "rt", "time"] }
